[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lookupluke-verify"
version = "1.1.0"
description = "Verify Lookup Luke evidence bundles without trusting Lookup Luke: Merkle root, Ed25519 signature, RFC 3161 and OpenTimestamps."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lookup Luke" }]
keywords = ["osint", "evidence", "verifiable-credentials", "rfc3161", "opentimestamps", "did-web"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "cryptography>=43",
  "rfc8785>=0.1.4",
  "asn1crypto>=1.5",
  "certifi>=2024.2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
tests = ["pytest>=8"]

[project.urls]
Homepage = "https://lookupluke.com"
Documentation = "https://app.lookupluke.com/docs/verify-a-bundle"
Source = "https://github.com/lookupluke/look-up-luke/tree/main/packages/lookupluke-verify"
Issues = "https://github.com/lookupluke/look-up-luke/issues"

[project.scripts]
lookupluke-verify = "lookupluke_verify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lookupluke_verify"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asn1crypto.*", "rfc8785.*"]
ignore_missing_imports = true
